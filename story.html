<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 序章</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh; background-color: #000; color: #fff;
    font-family: "SimSun", serif; overflow: hidden;
  }
  
  .page {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; justify-content: flex-start; 
    padding: 40px 8%; background-size: cover; background-position: center;
  }
  .page.active { display: flex; }
  
  /* 顶部渐变遮罩，保证文字清晰 */
  .page::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%);
    z-index: -1;
  }

  /* 已准确替换为你提供的 png 文件名 */
  #page1 { background-image: url('./9191.png'); }
  #page2 { background-image: url('./7878.png'); }
  #page3 { background-image: url('./6666.png'); }

  .text-box {
    font-size: 1.3rem; line-height: 1.8; letter-spacing: 2px;
    text-shadow: 2px 2px 5px #000, 0 0 10px rgba(0,0,0,1); 
    margin-bottom: 20px; opacity: 0; transition: opacity 1.5s ease;
    color: #fff;
  }
  .text-box.show { opacity: 1; }

  .btn-area {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; margin-top: auto; margin-bottom: 20px;
    opacity: 0; transition: opacity 1.5s ease;
  }
  .btn-area.show { opacity: 1; }

  .play-btn {
    padding: 10px 25px; background: rgba(0,0,0,0.5); border: 1px solid #888;
    color: #ccc; font-size: 1rem; cursor: pointer; border-radius: 4px;
  }
  .play-btn:active { background: #333; color: #fff; }

  .next-btn {
    padding: 10px 30px; background: rgba(255,255,255,0.2); border: 1px solid #aaa;
    color: #fff; font-size: 1rem; cursor: pointer; border-radius: 4px;
  }
  .next-btn:active { background: #555; }

  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center;
    color: #8a0f0f; font-size: 1.5rem;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <!-- 隐藏的音频 -->
  <audio id="audio1" src="./666.mp3" preload="auto"></audio>
  <audio id="audio2" src="./91.mp3" preload="auto"></audio>
  <audio id="audio3" src="./3.mp3" preload="auto"></audio>

  <!-- 第一页 -->
  <div class="page active" id="page1">
    <div class="text-box" id="text1">
      你叫邓凯，你的好兄弟樂乌说他要去一个地方旅行。<br><br>
      结果3天了，你发的消息一条没回。<br><br>
      于是你决定去所谓的新京村看看。
    </div>
    <div class="btn-area" id="ctrl1">
      <button class="play-btn" onclick="playAudio('audio1')">▶ 播放旁白</button>
      <button class="next-btn" onclick="nextPage(2, 2)">下一页</button>
    </div>
  </div>

  <!-- 第二页 -->
  <div class="page" id="page2">
    <div class="text-box" id="text2">
      你坐在家里，看着手机屏幕发呆。<br><br>
      心里总有一种说不出的不安感。
    </div>
    <div class="btn-area" id="ctrl2">
      <button class="play-btn" onclick="playAudio('audio2')">▶ 播放旁白</button>
      <button class="next-btn" onclick="nextPage(3, 3)">下一页</button>
    </div>
  </div>

  <!-- 第三页 -->
  <div class="page" id="page3">
    <div class="text-box" id="text3">
      邓凯喃喃自语：<br><br>“先去浏览器看看。”
    </div>
    <div class="btn-area" id="ctrl3">
      <button class="play-btn" onclick="playAudio('audio3')">▶ 播放旁白</button>
      <button class="next-btn" onclick="window.location.href='./phone.html'">进入手机</button>
    </div>
  </div>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => { 
      document.getElementById('text1').classList.add('show'); 
      document.getElementById('ctrl1').classList.add('show');
    }, 500);
  });

  function playAudio(audioId) {
    document.getElementById('audio1').pause();
    document.getElementById('audio2').pause();
    document.getElementById('audio3').pause();
    
    var audio = document.getElementById(audioId);
    audio.currentTime = 0;
    audio.play().catch(e => console.log("音频未找到"));
  }

  function nextPage(pageNum, textNum) {
    document.getElementById('audio1').pause();
    document.getElementById('audio2').pause();
    document.getElementById('audio3').pause();

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + pageNum).classList.add('active');
    
    setTimeout(() => { 
      document.getElementById('text' + textNum).classList.add('show'); 
      document.getElementById('ctrl' + textNum).classList.add('show');
    }, 300);
  }
</script>
</body>
</html>
