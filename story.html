<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 序章</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh; background-color: #000; color: #fff;
    font-family: "SimSun", serif; overflow: hidden;
  }
  .page {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; justify-content: flex-end; padding: 40px 10%;
    background-size: cover; background-position: center;
  }
  .page.active { display: flex; }
  .page::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
    z-index: -1;
  }
  #page1 { background-image: url('./bg1.jpg'); }
  #page2 { background-image: url('./bg2.jpg'); }
  #page3 { background-image: url('./bg3.jpg'); }

  .text-box {
    font-size: 1.4rem; line-height: 2; letter-spacing: 2px;
    text-shadow: 2px 2px 5px #000, 0 0 10px rgba(255,255,255,0.3); 
    margin-bottom: 30px; opacity: 0; transition: opacity 1.5s ease;
    color: #e0e0e0;
  }
  .text-box.show { opacity: 1; }

  .next-btn {
    align-self: flex-end; padding: 12px 40px; background: rgba(255,255,255,0.1);
    border: 1px solid #666; color: #fff; font-size: 1.1rem; cursor: pointer;
    opacity: 0; transition: opacity 1.5s ease; margin-right: 20px;
  }
  .next-btn.show { opacity: 1; }
  .next-btn:active { background: #333; }

  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center;
    color: #8a0f0f; font-size: 1.5rem;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <!-- 直接把音频文件藏在网页里 -->
  <audio id="audio1" src="./666.mp3" preload="auto"></audio>
  <audio id="audio2" src="./91.mp3" preload="auto"></audio>

  <div class="page active" id="page1">
    <div class="text-box" id="text1">
      你叫邓凯，你的好兄弟樂乌说他要去一个地方旅行。<br><br>
      结果3天了，你发的消息一条没回。于是你决定去所谓的新京村看看。
    </div>
    <button class="next-btn" id="btn1" onclick="playAndNext()">播放旁白 / 下一页</button>
  </div>

  <div class="page" id="page2">
    <div class="text-box" id="text2">
      你坐在家里，看着手机屏幕发呆。<br><br>
      心里总有一种说不出的不安感。
    </div>
    <button class="next-btn" id="btn2" onclick="nextPage(3, 3)">下一页</button>
  </div>

  <div class="page" id="page3">
    <div class="text-box" id="text3">
      邓凯喃喃自语：<br><br>“先去浏览器看看。”
    </div>
    <button class="next-btn" id="btn3" onclick="playAndEnter()">进入手机</button>
  </div>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => { document.getElementById('text1').classList.add('show'); }, 500);
    setTimeout(() => { document.getElementById('btn1').classList.add('show'); }, 1500);
  });

  // 点击第一页的按钮
  function playAndNext() {
    var audio = document.getElementById('audio1');
    audio.play(); // 强行播放
    // 延迟一秒钟再切页，让声音先出来
    setTimeout(() => {
      nextPage(2, 2);
    }, 1000);
  }

  // 点击进入手机的按钮
  function playAndEnter() {
    var audio = document.getElementById('audio2');
    audio.play();
    // 延迟一秒半跳转
    setTimeout(() => {
      window.location.href = './phone.html';
    }, 1500);
  }

  function nextPage(pageNum, textNum) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + pageNum).classList.add('active');
    setTimeout(() => { document.getElementById('text' + textNum).classList.add('show'); }, 300);
    setTimeout(() => { document.getElementById('btn' + textNum).classList.add('show'); }, 1500);
  }
</script>
</body>
</html>
