<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 序章</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh; background-color: #000; color: #fff;
    font-family: "SimSun", serif; overflow: hidden;
  }
  
  .page {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; justify-content: flex-end; padding: 40px 10%;
    background-size: cover; background-position: center;
  }
  .page.active { display: flex; }
  .page::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
    z-index: -1;
  }
  
  /* 这里记得换成你上传的图片名 */
  #page1 { background-image: url('./bg1.jpg'); }
  #page2 { background-image: url('./bg2.jpg'); }
  #page3 { background-image: url('./bg3.jpg'); }

  .text-box {
    font-size: 1.4rem; line-height: 2; letter-spacing: 2px;
    text-shadow: 2px 2px 5px #000, 0 0 10px rgba(255,255,255,0.3); 
    margin-bottom: 30px; opacity: 0; transition: opacity 1.5s ease;
    color: #e0e0e0;
  }
  .text-box.show { opacity: 1; }

  /* 底部按钮排版容器 */
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; margin-top: 20px; opacity: 0; transition: opacity 1.5s ease;
  }
  .controls.show { opacity: 1; }

  /* 播放声音按钮 */
  .audio-btn {
    padding: 12px 30px; background: rgba(255,255,255,0.05);
    border: 1px dashed #666; color: #aaa; font-size: 1.1rem; cursor: pointer;
    letter-spacing: 2px;
  }
  .audio-btn:active { background: rgba(255,255,255,0.2); color: #fff; }

  /* 下一页按钮 */
  .next-btn {
    padding: 12px 40px; background: rgba(255,255,255,0.1);
    border: 1px solid #666; color: #fff; font-size: 1.1rem; cursor: pointer;
  }
  .next-btn:active { background: #333; }

  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center;
    color: #8a0f0f; font-size: 1.5rem;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <!-- 隐藏的音频文件，确保名字和 GitHub 上的一模一样 -->
  <audio id="audio1" src="./666.mp3" preload="auto"></audio>
  <audio id="audio2" src="./91.mp3" preload="auto"></audio>

  <!-- 第一页 -->
  <div class="page active" id="page1">
    <div class="text-box" id="text1">
      你叫邓凯，你的好兄弟樂乌说他要去一个地方旅行。<br><br>
      结果3天了，你发的消息一条没回。于是你决定去所谓的新京村看看。
    </div>
    <div class="controls" id="ctrl1">
      <!-- 独立播放按钮 -->
      <button class="audio-btn" onclick="playAudio('audio1')">▶ 播放旁白</button>
      <button class="next-btn" onclick="nextPage(2, 2)">下一页</button>
    </div>
  </div>

  <!-- 第二页 -->
  <div class="page" id="page2">
    <div class="text-box" id="text2">
      你坐在家里，看着手机屏幕发呆。<br><br>
      心里总有一种说不出的不安感。
    </div>
    <div class="controls" id="ctrl2">
      <!-- 第二页如果有音频，也可以加在这里。没有就不加 -->
      <div></div> <!-- 占位符，把下一页挤到右边 -->
      <button class="next-btn" onclick="nextPage(3, 3)">下一页</button>
    </div>
  </div>

  <!-- 第三页 -->
  <div class="page" id="page3">
    <div class="text-box" id="text3">
      邓凯喃喃自语：<br><br>“先去浏览器看看。”
    </div>
    <div class="controls" id="ctrl3">
      <!-- 独立播放按钮 -->
      <button class="audio-btn" onclick="playAudio('audio2')">▶ 播放录音</button>
      <button class="next-btn" onclick="window.location.href='./phone.html'">进入手机</button>
    </div>
  </div>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => { 
      document.getElementById('text1').classList.add('show'); 
      document.getElementById('ctrl1').classList.add('show');
    }, 500);
  });

  // 专门播放声音的函数
  function playAudio(audioId) {
    // 先把所有可能在播放的音频暂停
    var a1 = document.getElementById('audio1');
    var a2 = document.getElementById('audio2');
    a1.pause(); a1.currentTime = 0;
    a2.pause(); a2.currentTime = 0;

    // 播放目标音频
    var audio = document.getElementById(audioId);
    audio.play().catch(e => {
      console.log("播放被拦截或文件错误");
      alert("音频播放失败，请确保 666.mp3 或 91.mp3 已正确上传！");
    });
  }

  // 翻页逻辑
  function nextPage(pageNum, textNum) {
    // 翻页时，把正在播放的声音关掉
    document.getElementById('audio1').pause();
    document.getElementById('audio2').pause();

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + pageNum).classList.add('active');
    
    setTimeout(() => { 
      document.getElementById('text' + textNum).classList.add('show'); 
      document.getElementById('ctrl' + textNum).classList.add('show');
    }, 300);
  }
</script>
</body>
</html>
