<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 地狱</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh;
    background-color: #000; color: #fff; 
    font-family: "SimSun", serif; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  /* 地狱背景图 */
  .hell-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('https://images.unsplash.com/photo-1505682634904-d7c8d95cdc50?q=80&w=1200&auto=format&fit=crop'); /* 用一张红色地狱网图代替，你可以换成你传的 hell.jpg */
    background-size: cover; background-position: center;
    z-index: -1; filter: brightness(0.6) contrast(1.2);
  }

  /* 旁白文字 */
  .narration {
    font-size: 1.5rem; letter-spacing: 3px; line-height: 2;
    text-shadow: 2px 2px 5px #000; text-align: center;
    padding: 0 10%; opacity: 0; transition: opacity 2s ease;
    z-index: 10;
  }
  .narration.show { opacity: 1; }

  /* 隐藏的“？” */
  .question-mark {
    position: absolute; right: 20%; top: 40%;
    font-size: 10rem; color: #ff2b2b; font-weight: bold;
    text-shadow: 0 0 20px red, 0 0 50px darkred;
    opacity: 0; transform: scale(0.5);
    transition: opacity 0.5s ease, transform 0.5s ease;
    z-index: 20; pointer-events: none;
  }
  .question-mark.show { opacity: 1; transform: scale(1); }
</style>
</head>
<body>

  <div class="hell-bg"></div>

  <div class="narration" id="narration">
    主角看着看着，突然感觉好热啊，抬头一看...<br><br>
    holyshit，我怎么在地狱里？？？
  </div>

  <!-- 恐怖的大问号 -->
  <div class="question-mark" id="qMark">？</div>

<script>
  // 3秒后出现旁白
  setTimeout(() => {
    document.getElementById('narration').classList.add('show');
  }, 500);

  // 旁白出现后的3秒，突然出现巨大的问号
  setTimeout(() => {
    document.getElementById('qMark').classList.add('show');
  }, 4000);
</script>
</body>
</html>
