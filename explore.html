<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>探索 - 新京村</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh;
    background-color: #000; color: #fff; 
    font-family: "SimSun", serif; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  /* 文字容器 */
  .intro-text {
    font-size: 2rem; letter-spacing: 5px; color: #ddd;
    text-align: center; position: absolute;
    transition: opacity 2s ease;
    z-index: 10;
  }

  /* 探索区域（文字结束后显示） */
  .explore-area {
    display: none; width: 100%; height: 100%;
    position: relative; opacity: 0; transition: opacity 2s ease;
  }
  .explore-area.show { display: block; opacity: 1; }

  /* 四个方向的箭头 */
  .arrow {
    position: absolute; color: rgba(255,255,255,0.2);
    font-size: 4rem; cursor: pointer; transition: color 0.3s, transform 0.2s;
    z-index: 20;
  }
  .arrow:active { color: #ff2b2b; transform: scale(0.8); }

  .arrow.up { top: 20px; left: 50%; transform: translateX(-50%); }
  .arrow.down { bottom: 20px; left: 50%; transform: translateX(-50%); }
  .arrow.left { left: 30px; top: 50%; transform: translateY(-50%); }
  .arrow.right { right: 30px; top: 50%; transform: translateY(-50%); }

  /* 中间的场景占位图 */
  .scene-img {
    width: 100%; height: 100%; object-fit: contain;
    background: #111; display: none;
  }
</style>
</head>
<body>

  <!-- 开场打字特效 -->
  <div class="intro-text" id="introText"></div>

  <!-- 探索区域 -->
  <div class="explore-area" id="exploreArea">
    <!-- 场景图（暂用纯黑，以后可以换成你画的场景图） -->
    <div class="scene-img"></div>

    <!-- 上北下南左西右东 -->
    <div class="arrow up" onclick="go('上')">▲</div>
    <div class="arrow down" onclick="go('下')">▼</div>
    <div class="arrow left" onclick="go('左')">◀</div>
    <div class="arrow right" onclick="go('右')">▶</div>
  </div>

<script>
  const textToType = "三天后，到了新京村。";
  const introEl = document.getElementById('introText');
  let charIndex = 0;

  // --- 合成打字音效（无需外部MP3） ---
  function playTypingSound() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    // 调整参数让它听起来像打字机/敲击声
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, ctx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
    
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  // 打字机效果逻辑
  function typeWriter() {
    if (charIndex < textToType.length) {
      introEl.innerHTML += textToType.charAt(charIndex);
      playTypingSound(); // 每写一个字，响一下
      charIndex++;
      setTimeout(typeWriter, 300); // 300毫秒打一个字，缓慢浮现
    } else {
      // 打完字了，等2秒进入探索模式
      setTimeout(() => {
        introEl.style.opacity = '0';
        setTimeout(() => {
          introEl.style.display = 'none';
          document.getElementById('exploreArea').classList.add('show');
        }, 2000);
      }, 2000);
    }
  }

  // 页面加载稍微等1秒开始打字
  setTimeout(typeWriter, 1000);

  // 箭头点击事件
  function go(direction) {
    // 这里以后用来写地图移动逻辑，现在先弹个提示
    console.log("去往：" + direction);
    // 如果你想测试，可以暂时取消下面这行的注释
    // alert("你向" + direction + "走去...");
  }
</script>
</body>
</html>
