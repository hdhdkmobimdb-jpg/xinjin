<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 废区探索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh;
    background-color: #000; color: #fff; 
    font-family: "SimSun", serif; overflow: hidden; position: relative;
  }

  /* 开场文字 */
  .intro-text {
    font-size: 2rem; letter-spacing: 5px; color: #ddd;
    text-align: center; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity 2s ease; z-index: 10;
    pointer-events: none;
  }
  .intro-text.show { opacity: 1; }

  /* ================= 废区背景图 ================= */
  .scene-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-color: #0a0a0a; /* 如果图片没加载出来就是纯黑 */
    
    /* 👇👇👇 把你的废区图片名字填到这里！ 👇👇👇 */
    background-image: url('./village.png'); 
    
    background-size: cover; 
    background-position: center;
    background-repeat: no-repeat;
    z-index: 1;
    
    /* 把图片压暗，这样手电筒照上去才有感觉 */
    filter: brightness(0.3); 
  }

  /* 手电筒遮罩 */
  .flashlight {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    /* 光圈中心是透明的，四周是纯黑 */
    background: radial-gradient(circle 150px at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 100%);
    z-index: 2; pointer-events: none; transition: background 0.1s;
  }

  .explore-area {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 3; display: none; opacity: 0; transition: opacity 2s;
  }
  .explore-area.show { display: block; opacity: 1; }

  /* ================= 隐藏的眼睛 ================= */
  .eye-spot {
    position: absolute; top: 15%; right: 15%; width: 60px; height: 60px;
    border-radius: 50%; cursor: pointer; z-index: 5;
    display: flex; justify-content: center; align-items: center;
  }
  .eye-spot.open {
    background: #000;
    border: 2px solid #ff2b2b;
    box-shadow: 0 0 30px red;
  }
  .eye-white {
    width: 35px; height: 18px; background: #fff; border-radius: 50%;
    display: none;
  }
  .eye-pupil {
    width: 12px; height: 12px; background: #000; border-radius: 50%;
    position: absolute;
  }
  .eye-spot.open .eye-white { display: flex; justify-content: center; align-items: center; animation: openEye 0.4s ease-out; }
  
  @keyframes openEye {
    0% { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }

  /* ================= 结局一：团圆 ================= */
  .home-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #111; 
    display: none; flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; opacity: 0; transition: opacity 3s ease;
    padding: 0 10%;
  }
  .home-screen.show { display: flex; opacity: 1; }

  .dialogue {
    font-size: 1.5rem; line-height: 2; letter-spacing: 2px;
    color: #ddd; text-align: center; text-shadow: 1px 1px 3px #000;
    opacity: 0; transition: opacity 2s ease;
    max-width: 800px;
  }
  .dialogue.show { opacity: 1; }

  .yi-text {
    color: #fff; font-weight: bold; font-size: 2rem; cursor: pointer;
    display: inline-block; margin-left: 10px;
    transition: all 0.5s ease;
  }

  /* 扭曲特效 */
  .glitch-mode {
    color: #ff0000 !important;
    text-shadow: 0 0 20px red, 0 0 10px darkred !important;
    animation: shake 0.1s infinite;
  }
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-2px, 0px) rotate(-1deg); }
    40% { transform: translate(1px, -2px) rotate(1deg); }
    60% { transform: translate(-1px, 2px) rotate(0deg); }
    80% { transform: translate(2px, 1px) rotate(-1deg); }
    100% { transform: translate(1px, -1px) rotate(1deg); }
  }

  .blood-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(50,0,0,0.6); backdrop-filter: blur(3px) hue-rotate(90deg);
    display: none; z-index: 110;
  }
  .blood-overlay.show { display: block; }
</style>
</head>
<body>

  <div class="intro-text" id="introText"></div>

  <div class="scene-bg"></div>
  <div class="flashlight" id="flashlight"></div>

  <div class="explore-area" id="exploreArea">
    <div class="eye-spot" id="eyeSpot" ontouchstart="startStare()" ontouchend="stopStare()" onmousedown="startStare()" onmouseup="stopStare()" onmouseleave="stopStare()">
      <div class="eye-white"><div class="eye-pupil"></div></div>
    </div>
  </div>

  <!-- 结局一：团圆 -->
  <div class="home-screen" id="homeScreen">
    <div class="dialogue" id="homeDialogue"></div>
  </div>

  <div class="blood-overlay" id="bloodOverlay"></div>

<script>
  // 合成打字音效
  function playTypingSound() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, ctx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  // 通用打字机
  function typeWriter(el, text, speed, callback) {
    el.innerHTML = '';
    el.classList.add('show');
    let i = 0;
    function type() {
      if (i < text.length) {
        el.innerHTML += text.charAt(i);
        playTypingSound();
        i++;
        setTimeout(type, speed);
      } else {
        if (callback) callback();
      }
    }
    type();
  }

  // 开场剧情
  window.addEventListener('load', () => {
    typeWriter(document.getElementById('introText'), "三天后，到了新京村。", 150, () => {
      setTimeout(() => {
        typeWriter(document.getElementById('introText'), "为什么这里是个废区？", 200, () => {
          setTimeout(() => {
            document.getElementById('introText').style.opacity = '0';
            setTimeout(() => {
              document.getElementById('introText').style.display = 'none';
              document.getElementById('exploreArea').classList.add('show');
              updateLight(window.innerWidth/2, window.innerHeight/2);
            }, 1500);
          }, 2000);
        });
      }, 1500);
    });
  });

  // ================== 手电筒特效 ==================
  const flashlight = document.getElementById('flashlight');
  function updateLight(x, y) {
    // 中心完全透明（能看清背景图），四周纯黑（遮住背景图）
    flashlight.style.background = `radial-gradient(circle 150px at ${x}px ${y}px, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 100%)`;
  }
  document.addEventListener('mousemove', (e) => updateLight(e.clientX, e.clientY));
  document.addEventListener('touchmove', (e) => {
    if(e.touches.length > 0) updateLight(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // ================== 照射眼睛 ==================
  let stareTimer = null;
  let isStaring = false;

  function startStare() {
    if (isStaring) return;
    isStaring = true;
    
    stareTimer = setTimeout(() => {
      document.getElementById('eyeSpot').classList.add('open');
      
      setTimeout(() => {
        triggerHomeEnding();
      }, 2000);
    }, 3000);
  }

  function stopStare() {
    isStaring = false;
    clearTimeout(stareTimer);
  }

  // ================== 结局一：回家 ==================
  function triggerHomeEnding() {
    flashlight.style.background = 'rgba(0,0,0,1)';
    
    setTimeout(() => {
      document.getElementById('exploreArea').style.display = 'none';
      flashlight.style.display = 'none';
      
      const home = document.getElementById('homeScreen');
      home.classList.add('show');
      
      const dialogue = document.getElementById('homeDialogue');
      
      typeWriter(dialogue, "兄弟你怎么那么久醒啊，蛋糕都快化了。", 100, () => {
        setTimeout(() => {
          dialogue.innerHTML = "原来这都是一场梦，哈哈哈，哈哈哈，哈哈，哈，<br><br>结局一“团圆”";
          playTypingSound(); 
          
          setTimeout(() => {
            dialogue.innerHTML += `<span class="yi-text" onclick="triggerGlitch()">咦？</span>`;
          }, 1500);
          
        }, 2000);
      });
      
    }, 2000);
  }

  // ================== 扭曲反转 ==================
  function triggerGlitch() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 1);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1);
    }

    document.getElementById('homeDialogue').classList.add('glitch-mode');
    document.getElementById('bloodOverlay').classList.add('show');
    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
  }
</script>
</body>
</html>
