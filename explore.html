<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 探索</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh;
    background-color: #000; color: #fff; 
    font-family: "SimSun", serif; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  /* 开场文字 */
  .intro-text {
    font-size: 2rem; letter-spacing: 5px; color: #ddd;
    text-align: center; position: absolute;
    opacity: 0; transition: opacity 2s ease;
    z-index: 10;
  }
  .intro-text.show { opacity: 1; }

  /* 结局黑屏 */
  .ending-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: #000; display: none; 
    flex-direction: column; justify-content: center; align-items: center;
    z-index: 100; opacity: 0; transition: opacity 2s ease;
  }
  .ending-screen.show { display: flex; opacity: 1; }
  
  .ending-title { color: #ff2b2b; font-size: 3rem; font-weight: bold; margin-bottom: 30px; letter-spacing: 10px; }
  .ending-desc { color: #888; font-size: 1.2rem; line-height: 2; letter-spacing: 2px; text-align: center; }
</style>
</head>
<body>

  <div class="intro-text" id="introText"></div>

  <!-- 结局一：失踪 -->
  <div class="ending-screen" id="badEnding">
    <div class="ending-title">结局一：“失踪”</div>
    <div class="ending-desc">
      坏结局。<br><br>
      你的好兄弟彻底消失了，没人知道他在哪里。
    </div>
  </div>

<script>
  let step = 0;
  const introEl = document.getElementById('introText');

  // 模拟打字音效
  function playTypingSound() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, ctx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }

  // 打字效果
  function typeWriter(text, callback) {
    introEl.innerHTML = '';
    introEl.classList.add('show');
    let i = 0;
    function type() {
      if (i < text.length) {
        introEl.innerHTML += text.charAt(i);
        playTypingSound();
        i++;
        setTimeout(type, 200); // 打两个字
      } else {
        if (callback) callback();
      }
    }
    type();
  }

  // 启动流程
  window.addEventListener('load', () => {
    // 前3秒显示“三天后”
    typeWriter("三天后，到了新京村。", () => {
      setTimeout(() => {
        // 主角说话
        typeWriter("为什么这里是个废区？", () => {
          // 说话后3秒触发结局
          setTimeout(() => {
            document.getElementById('badEnding').classList.add('show');
          }, 3000);
        });
      }, 2000);
    });
  });
</script>
</body>
</html>
