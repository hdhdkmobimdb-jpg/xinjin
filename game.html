<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height: 100vh; background: #000;
    display: flex; justify-content: center; align-items: center;
    font-family: "SimSun", serif; overflow: hidden; position: relative;
  }
  .page { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
  .page.active { display: flex; }
  
  /* 风景图 */
  .bg-img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -1; filter: brightness(0.7);
  }
  
  .title { color: #ff2b2b; font-size: 2rem; margin-bottom: 20px; }
  .welcome-text { color: #fff; font-size: 3rem; letter-spacing: 8px; margin-bottom: 30px; z-index: 10; }
  
  /* 所有按钮的通用样式 */
  button {
    padding: 12px 40px; background: rgba(0,0,0,0.6); border: 1px solid #555;
    color: #fff; font-size: 1.2rem; cursor: pointer; z-index: 10;
  }
</style>
</head>
<body>

  <!-- 页面 1：警告页 -->
  <div class="page active" id="page1">
    <div class="title">警告</div>
    <p style="color:#888; margin-bottom:30px;">光敏性癫痫患者请离开</p>
    <button onclick="goToPage2()">我已了解，进入游戏</button>
  </div>

  <!-- 页面 2：风景图 -->
  <div class="page" id="page2">
    <!-- 👇 这里直接写图片名 2.jpg，绝对不卡 -->
    <img class="bg-img" src="2.jpg">
    <div class="welcome-text">欢迎来到新京村</div>
    <button onclick="goToBoard()">开始探索</button>
  </div>

<script>
  // 第一步：切到风景页
  function goToPage2() {
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
  }

  // 第二步：真正跳转到公告板网页
  function goToBoard() {
    window.location.href = 'board.html';
  }
</script>
</body>
</html>
