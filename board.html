<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 公告栏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; 
    height: 100vh; height: 100dvh;
    
    /* 👇 改为直接在 body 上设置全屏背景图，绝对铺满！ 👇 */
    background-image: url('3.jpg');
    background-size: cover;      /* 铺满全屏，不留黑边 */
    background-position: center; /* 居中显示 */
    background-repeat: no-repeat;
    background-color: #000; 
    
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: "SimSun", serif;
    overflow: hidden;
    position: relative;
  }
  
  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center;
    color: #8a0f0f; font-size: 1.5rem;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }

  /* 加一层黑色的半透明遮罩，让背景图暗下来，方便看清文字 */
  body::before {
    content: '';
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5); /* 50%透明的黑色，你可以自己调 0.5 这个数字 */
    z-index: -1;
  }

  /* 公告板主容器 */
  .board-container {
    width: 80%; max-width: 900px;
    background: rgba(10, 10, 10, 0.85); 
    border: 2px solid #333;
    padding: 30px;
    box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 10px 30px rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    position: relative;
    opacity: 0;
    transform: translateY(20px);
    transition: all 2s ease; 
    z-index: 10;
  }
  .board-container.show { opacity: 1; transform: translateY(0); }

  .header {
    text-align: center; color: #ccc; font-size: 1.8rem;
    letter-spacing: 5px; border-bottom: 2px solid #444;
    padding-bottom: 15px; margin-bottom: 20px;
  }

  .admin-list {
    display: flex; justify-content: space-around;
    color: #888; font-size: 1.2rem; margin-bottom: 30px;
  }
  .admin-list span { border-bottom: 1px dashed #444; padding-bottom: 5px; }

  .tasks { display: flex; justify-content: space-around; }
  
  .task-btn {
    width: 45%; padding: 20px; background: rgba(26, 26, 26, 0.9);
    border: 1px solid #333; color: #aaa; font-size: 1.4rem;
    text-align: center; letter-spacing: 4px; cursor: pointer;
    transition: all 0.3s; outline: none;
  }
  .task-btn:hover, .task-btn:active { background: #2a0a0a; border-color: #6a0f0f; color: #ff2b2b; }

  .footer-warning {
    text-align: center; color: #444; font-size: 0.9rem;
    margin-top: 30px; letter-spacing: 2px;
  }

  /* ================= 剧情弹窗覆盖层 ================= */
  .story-popup {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); 
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
    z-index: 100;
  }
  .story-popup.show { opacity: 1; pointer-events: auto; }
  
  .story-text {
    color: #ff2b2b; font-size: 1.5rem; letter-spacing: 3px;
    text-align: center; line-height: 2; padding: 0 10%;
    opacity: 0; transform: translateY(10px);
    transition: all 2s ease;
  }
  .story-text.show { opacity: 1; transform: translateY(0); }

  .back-btn {
    margin-top: 40px; padding: 10px 30px; background: transparent;
    border: 1px solid #444; color: #888; font-size: 1rem;
    cursor: pointer; opacity: 0; transition: opacity 1s ease;
  }
  .back-btn.show { opacity: 1; }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <div class="board-container" id="boardPanel">
    <div class="header">新京村村委会公告板</div>
    
    <div class="admin-list">
      <span>村长：李永信</span>
      <span>副村长：王力石</span>
    </div>

    <div class="tasks">
      <div class="task-btn" onclick="showStory('small')">村内小事</div>
      <div class="task-btn" onclick="showStory('big')">村内大事</div>
    </div>

    <div class="footer-warning">（请村民及外来访客注意言行）</div>
  </div>

  <!-- 隐藏的剧情弹窗 -->
  <div class="story-popup" id="storyPopup">
    <div class="story-text" id="storyText"></div>
    <button class="back-btn" id="backBtn" onclick="closeStory()">返回公告板</button>
  </div>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('boardPanel').classList.add('show');
    }, 500); 
  });

  function showStory(type) {
    const popup = document.getElementById('storyPopup');
    const text = document.getElementById('storyText');
    const backBtn = document.getElementById('backBtn');

    popup.classList.add('show');
    
    if (type === 'big') {
      text.innerHTML = "【村内大事】<br><br>档案资料已被撕毁。<br><br>地上只留下了一张纸条：<br>“李村长疯了，别信他。”";
    } else {
      text.innerHTML = "【村内小事】<br><br>档案室的门被生锈的铁链锁着。<br><br>门缝里似乎渗出暗红色的液体...";
    }

    setTimeout(() => { text.classList.add('show'); }, 500);
    setTimeout(() => { backBtn.classList.add('show'); }, 2000);
  }

  function closeStory() {
    document.getElementById('storyPopup').classList.remove('show');
    document.getElementById('storyText').classList.remove('show');
    document.getElementById('backBtn').classList.remove('show');
  }
</script>
</body>
</html>
