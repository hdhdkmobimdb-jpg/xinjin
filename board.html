<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 公告栏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    height: 100vh; height: 100dvh;
    background-color: #000;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    font-family: "SimSun", serif;
    overflow: hidden;
    position: relative;
  }
  
  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center;
    color: #8a0f0f; font-size: 1.5rem;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }

  /* 背景图：锁定 640:426 比例 */
  .bg-img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; 
    z-index: -1;
    filter: brightness(0.6) contrast(1.2); 
  }

  /* 主面板：初始透明且防误触 */
  .board-container {
    width: 80%; max-width: 900px;
    background: rgba(10, 10, 10, 0.85); 
    border: 2px solid #333;
    padding: 30px;
    box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 10px 30px rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    position: relative;
    
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px);
    transition: all 2s ease; /* 2秒渐显动画 */
  }

  /* 当 JS 加上 .show 后，才允许点击 */
  .board-container.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .header {
    text-align: center; color: #ccc; font-size: 1.8rem;
    letter-spacing: 5px; border-bottom: 2px solid #444;
    padding-bottom: 15px; margin-bottom: 20px;
  }

  .admin-list {
    display: flex; justify-content: space-around;
    color: #888; font-size: 1.2rem; margin-bottom: 30px;
  }
  .admin-list span { border-bottom: 1px dashed #444; padding-bottom: 5px; }

  .tasks { display: flex; justify-content: space-around; }
  
  .task-btn {
    width: 45%; padding: 20px; background: rgba(26, 26, 26, 0.9);
    border: 1px solid #333; color: #aaa; font-size: 1.4rem;
    text-align: center; letter-spacing: 4px; cursor: pointer;
    transition: all 0.3s;
  }
  .task-btn:active { background: #2a0a0a; border-color: #6a0f0f; color: #ff2b2b; }

  .footer-warning {
    text-align: center; color: #444; font-size: 0.9rem;
    margin-top: 30px; letter-spacing: 2px;
  }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <!-- 引入 3.jpg 作为背景 -->
  <img class="bg-img" src="3.jpg">

  <!-- 添加了 id="boardPanel" 用于 JS 控制浮现 -->
  <div class="board-container" id="boardPanel">
    <div class="header">新京村村委会公告板</div>
    
    <div class="admin-list">
      <span>村内管理员：赵某某</span>
      <!-- 👇 名字已改 -->
      <span>村长：李永信</span>
      <span>副村长：王力石</span>
    </div>

    <div class="tasks">
      <div class="task-btn" onclick="alert('【村内小事】档案室已上锁。')">村内小事</div>
      <div class="task-btn" onclick="alert('【村内大事】资料已被撕毁。')">村内大事</div>
    </div>

    <div class="footer-warning">（请村民及外来访客注意言行）</div>
  </div>

<script>
  // 当页面加载完后，稍微停顿一下，让面板慢慢浮现出来
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('boardPanel').classList.add('show');
    }, 500); // 0.5秒后开始浮现
  });
</script>
</body>
</html>
