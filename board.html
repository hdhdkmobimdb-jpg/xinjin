<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 公告栏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; 
    height: 100vh; height: 100dvh;
    background-image: url('3.jpg');
    background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #000; 
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-family: "SimSun", serif; overflow: hidden; position: relative;
  }
  
  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center; color: #8a0f0f; font-size: 1.5rem;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }

  body::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); z-index: -1;
  }

  .board-container {
    width: 80%; max-width: 900px;
    background: rgba(10, 10, 10, 0.85); 
    border: 2px solid #333; padding: 30px;
    box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 10px 30px rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    position: relative; opacity: 0; transform: translateY(20px);
    transition: all 2s ease; z-index: 10;
  }
  .board-container.show { opacity: 1; transform: translateY(0); }

  .header {
    text-align: center; color: #ccc; font-size: 1.8rem;
    letter-spacing: 5px; border-bottom: 2px solid #444; padding-bottom: 15px; margin-bottom: 20px;
  }

  .admin-list {
    display: flex; justify-content: space-around;
    color: #888; font-size: 1.2rem; margin-bottom: 30px;
  }
  .admin-list span { border-bottom: 1px dashed #444; padding-bottom: 5px; }
  
  /* 主界面的点击名字 */
  #lixin { cursor: pointer; }
  #wlshi { cursor: pointer; color: #888; transition: color 0.3s; }
  #wlshi:active { color: #ff2b2b; }

  .tasks { display: flex; justify-content: space-around; }
  .task-btn {
    width: 45%; padding: 20px; background: rgba(26, 26, 26, 0.9);
    border: 1px solid #333; color: #aaa; font-size: 1.4rem;
    text-align: center; letter-spacing: 4px; cursor: pointer; transition: all 0.3s; outline: none;
  }
  .task-btn:active { background: #2a0a0a; border-color: #6a0f0f; color: #ff2b2b; }

  .footer-warning { text-align: center; color: #444; font-size: 0.9rem; margin-top: 30px; letter-spacing: 2px; }

  .popup {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); 
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.8s ease; z-index: 100;
  }
  .popup.show { opacity: 1; pointer-events: auto; }

  .lost-text { color: #888; font-size: 3rem; letter-spacing: 5px; font-family: sans-serif; }
  .lost-sub { color: #444; font-size: 1rem; margin-top: 20px; }
  .lock-box { background: #111; border: 1px solid #333; padding: 30px; width: 80%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
  .input-group { width: 100%; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  .input-group input { width: 65%; padding: 10px; background: #000; border: 1px solid #444; color: #fff; text-align: center; }
  .submit-btn { margin-top: 10px; padding: 12px 30px; background: transparent; border: 1px solid #555; color: #ccc; cursor: pointer; }
  .error-msg { color: #ff2b2b; font-size: 1rem; margin-top: 15px; display: none; }
  .close-popup { margin-top: 30px; padding: 12px 30px; background: rgba(255,255,255,0.1); border: 1px solid #666; color: #ccc; cursor: pointer; }
  
  .file-scroll-area { width: 90%; max-width: 800px; height: 70vh; background: #f5f5f5; overflow-y: auto; padding: 20px; }
  .file-box { background: #fff; border: 1px solid #ccc; padding: 25px; margin-bottom: 25px; text-align: center; cursor: pointer; }
  .file-title { color: #333; font-size: 1.1rem; font-weight: bold; }
  
  .detail-box { background: #fff; width: 85%; max-width: 700px; height: 70vh; padding: 30px 20px; overflow-y: auto; }
  .detail-title { font-size: 1.3rem; font-weight: bold; color: #b32020; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #b32020; }
  .detail-text { font-size: 1.1rem; line-height: 1.8; text-indent: 2em; }

  .secret-box { background: #111; border: 2px solid #444; padding: 40px 20px; width: 85%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }
  .secret-hint { color: #ff2b2b; font-size: 1.8rem; letter-spacing: 5px; font-family: monospace; margin-bottom: 20px; }
  .name-btn { width: 80%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.05); border: 1px solid #555; color: #ccc; font-size: 1.2rem; cursor: pointer; letter-spacing: 2px; }
  .name-btn:active { background: #333; }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <div class="board-container" id="boardPanel">
    <div class="header">新京村村委会公告板</div>
    
    <div class="admin-list">
      <!-- 👇 给村长李永信加上了专门的重置点击事件 👇 -->
      <span id="lixin" onclick="resetWangCount(event)">村长：李永信</span>
      <span id="wlshi" onclick="clickWang(event)">副村长：王力石</span>
    </div>

    <div class="tasks">
      <div class="task-btn" onclick="showLost()">村内大事</div>
      <div class="task-btn" onclick="showLock()">村内小事</div>
    </div>

    <div class="footer-warning">（请村民及外来访客注意言行）</div>
  </div>

  <!-- 网页丢失 -->
  <div class="popup" id="lostPopup">
    <div class="lost-text">404 Not Found</div>
    <div class="lost-sub">网页丢失</div>
    <div class="close-popup" onclick="closeAll()">【 返回公告板 】</div>
  </div>

  <!-- 密码锁 -->
  <div class="popup" id="lockPopup">
    <div class="lock-box">
      <div style="color: #ff2b2b; font-size: 1.5rem; margin-bottom: 20px; font-weight: bold;">非村里人请止步！</div>
      <div class="input-group">
        <label style="color:#aaa;">6位密码：</label>
        <input type="text" id="dateInput" maxlength="6" placeholder="例如：990101">
      </div>
      <div class="input-group">
        <label style="color:#aaa;">名字：</label>
        <input type="text" id="nameInput" placeholder="写下你的名字">
      </div>
      <button class="submit-btn" onclick="checkPassword()">我是村里人</button>
      <div class="error-msg" id="errorMsg">密码或名字错误！</div>
    </div>
    <div class="close-popup" onclick="closeAll()">【 放弃进入 】</div>
  </div>

  <!-- 档案室 -->
  <div class="popup" id="unlockedPopup" style="background: #e0e0e0;">
    <div class="file-scroll-area" id="fileList"></div>
    <div class="close-popup" onclick="closeAll()" style="background: #000; color: #fff; border-color: #333;">【 返回公告板 】</div>
  </div>

  <!-- 详情弹窗 -->
  <div class="popup" id="detailPopup">
    <div class="detail-box">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-text" id="detailText"></div>
    </div>
    <div class="close-popup" onclick="closeDetail()" style="background: #000; color: #fff; border-color: #333;">【 返回小事页面 】</div>
  </div>

  <!-- 机关密码锁 -->
  <div class="popup" id="secretLockPopup" style="background: #050505;">
    <div class="secret-box">
      <div class="secret-hint">og ees gnaw dna eel</div>
      <div style="color:#888; margin-bottom: 30px; text-align: center;">提示：将题目数字视为密码，也许应当倒过来看？<br>（按顺序点击村民的名字证明自己）</div>
      <button class="name-btn" onclick="clickName('1')">村长：李永信</button>
      <button class="name-btn" onclick="clickName('2')">副村长：王力石</button>
      <div class="error-msg" id="secretError" style="margin-top: 20px;">顺序错误，机关重置...</div>
    </div>
    <div class="close-popup" onclick="closeAll()" style="background: #000; color: #fff; border-color: #333;">【 返回 】</div>
  </div>

<script>
  const stories = [
    { title: "20号12月摊位线歪了！赵大婶和周叔吵起来", content: "<p>赵大婶，原名赵桂芬，57岁，菜市场豆腐摊贩；周叔，原名周德海，61岁，修鞋匠。</p><p>一天赵大婶在20号12月摊位卖豆腐，周叔非说她豆腐箱压过了修鞋摊的线。赵大婶不服：“我在这20号12月摊位卖了12年豆腐，豆腐都没喊冤！”周叔拿卷尺一量，说压了三指宽，赵大婶说那线本来就是歪的。两人越吵越凶，围观的人里三层外三层。</p><p>最后副村长来了，一查，原来那粉笔线是去年划的，被鸡蹭歪了。调解结果：赵大婶送周叔两块豆腐，周叔给赵大婶免费钉一副鞋掌。</p>" },
    { title: "10月10号24个蛋托送货单少给钱！刘嫂和钱大爷争执", content: "<p>刘嫂，原名刘春梅，34岁，卖鸡蛋；钱大爷，原名钱有福，70岁，收废品。</p><p>刘嫂拿着一张10月10号24个蛋托的送货单找钱大爷，说他少给了10块钱。钱大爷瞪眼：“我按10月10号单结的，咋会错？”刘嫂说单上明明写着24个蛋托，钱大爷说那是10月10日*编号24*，不是24个蛋托。两人吵得鸡蛋筐都晃了。</p><p>副村长赶来，翻过单子一看，背面写着“蛋托10个，碎2个，实收8个”。最后钱大爷补了3块，刘嫂送他两个鸡蛋，嘴里还嘟囔：“下回单子写清楚，别拿数字绕人！”</p>" },
    { title: "12月19号62号取件码拿错包！陈叔和吴婶吵翻", content: "<p>陈叔，原名陈建国，45岁，小卖部兼快递代收；吴婶，原名吴小丽，39岁，裁缝。</p><p>吴婶拿着12月19号62号取件码来取包裹，陈叔翻了半天说已经被取走了。吴婶急得脸红：“里面是客人等着改的裤子！”陈叔说：“你拿的是12月19号63，不是62。”两人一个说贴反了，一个说没贴反，吵得货架都震。</p><p>后来副村长来了，定睛一看，果然，是陈叔把6-2和6-3的标签贴反了，包裹压在最底下。陈叔赔礼，吴婶免了他一次改裤脚钱，围观的人笑得直拍腿。</p>" },
    { title: "9月19日6号蜂箱惹的祸！马大爷和何嫂起争执", content: "<p>马大爷，原名马长顺，66岁，养蜂人；何嫂，原名何玉兰，31岁，卖菜。</p><p>何嫂说马大爷的蜜蜂蜇了她一筐青菜，非要赔。马大爷指着蜂箱说：“我9月19日6号蜂箱今天根本没开，蜂都在里头！”何嫂说：“不是9月19日6号，就是9月19日9号，反正跑不了你！”两人从菜摊吵到路边，围观的人越来越多。</p><p>副村长找来邻村老魏一问，原来是老魏的蜂跑出来了，9月19日6号蜂箱确实没动。最后马大爷送半斤蜂蜜，何嫂送一把青菜，何嫂还说：“这蜂也真是，专挑数字大的箱跑！”</p>" },
    { title: "10月10日17号调解单又记一笔！胡大娘和杜叔吵起来", content: "<p>胡大娘，原名胡秀英，63岁，卖馒头；杜叔，原名杜金宝，58岁，磨刀匠。</p><p>杜叔磨刀水溅到胡大娘馒头屉上，胡大娘气得直拍案板：“10月10日17号调解登记单都记你三回了！”杜叔不服：“10月10日17是上回调解的日期，不是这回！”两人你一句我一句，馒头摊前围满了人。</p><p>副村长拿着调解单赶来，一看上次也是磨刀水惹的祸。调解结果：杜叔赔10个馒头，磨刀摊往后挪半米。胡大娘这才消气：“再挪半米，我这馒头就安全了。”</p>" },
    { title: "3斤2两的鱼被谁叼走了？杨嫂和冯爷吵起来", content: "<p>杨嫂，原名杨美芹，29岁，卖鱼；冯爷，原名冯老栓，72岁，看车棚。</p><p>杨嫂说冯爷车棚里的猫叼走了她3斤2两的鱼，冯爷说：“那猫20分钟前还在12号车棚睡觉，咋可能叼鱼？”两人吵到车棚门口，围观的人把路都堵了。</p><p>后来有人看见隔壁大黄狗嘴角有鱼鳞，才知道猫背了锅。副村长刘成调解：冯爷赔2两鱼钱，杨嫂送猫一条小鱼。冯爷叹气：“这猫看车棚没挣着钱，倒混上鱼了。”</p>" },
    { title: "5块钱和2两黄瓜丝！许叔和柳婶争执", content: "<p>许叔，原名许大勇，41岁，快递代收；柳婶，原名柳小芳，36岁，卖凉皮。</p><p>柳婶说许叔取快递时碰翻了她17号桌的凉皮，少给了5块钱；许叔说只碰掉了2两黄瓜丝，凭啥赔整碗。两人一个说“汤都洒了”，一个说“黄瓜丝还能捡”，吵得凉皮摊前围了一圈人。</p><p>副村长刘成调出小卖部门口监控，发现是风把遮阳布刮过来碰翻的。最后许叔补5块，柳婶给他多加2两面，许叔端着碗说：“这风可真会挑时候。”</p>" }
  ];

  window.addEventListener('load', () => {
    setTimeout(() => { document.getElementById('boardPanel').classList.add('show'); }, 500); 
    renderFiles(); 
  });

  function renderFiles() {
    const list = document.getElementById('fileList');
    let html = '';
    stories.forEach((story, index) => {
      html += `<div class="file-box" onclick="openStory(${index})"><div class="file-title">${story.title}</div></div>`;
    });
    list.innerHTML = html;
  }

  // ================== 主界面王力石点击跳转 & 防冲突 ==================
  let wangClickCount = 0;
  let wangTimer = null;

  // 点击王力石
  function clickWang(event) {
    if (event) event.stopPropagation(); 

    wangClickCount++;
    
    clearTimeout(wangTimer);
    wangTimer = setTimeout(() => {
      wangClickCount = 0;
    }, 1500);

    if (wangClickCount >= 3) {
      wangClickCount = 0; // 跳转前强制清零
      window.location.href = './wanglishi.html'; 
    }
  }

  // 👇 新增：点击村长李永信，立刻打断王力石的计数 👇
  function resetWangCount(event) {
    if (event) event.stopPropagation();
    wangClickCount = 0;
    clearTimeout(wangTimer);
  }

  // 点击页面其他任何地方，也重置王力石的计数
  document.addEventListener('click', function() {
    wangClickCount = 0;
    clearTimeout(wangTimer);
  });

  // 监听手机浏览器的“返回缓存”事件，强制重置所有状态
  window.addEventListener('pageshow', function(event) {
    wangClickCount = 0;
    detailTitleClicks = 0;
    userInput = "";
    document.querySelectorAll('.popup').forEach(p => p.classList.remove('show'));
  });

  // ================== 其他基础逻辑 ==================
  function showLost() { document.getElementById('lostPopup').classList.add('show'); }
  function showLock() {
    if (localStorage.getItem('xjj_unlocked') === 'true') {
      document.getElementById('unlockedPopup').classList.add('show');
    } else {
      document.getElementById('lockPopup').classList.add('show');
    }
  }

  function checkPassword() {
    const date = document.getElementById('dateInput').value.trim();
    const name = document.getElementById('nameInput').value.trim();
    const error = document.getElementById('errorMsg');

    if (date === '960705' && name === '王力石') {
      localStorage.setItem('xjj_unlocked', 'true');
      document.getElementById('lockPopup').classList.remove('show');
      document.getElementById('unlockedPopup').classList.add('show');
    } else {
      error.style.display = 'block';
      document.getElementById('lockPopup').style.transform = 'translateX(10px)';
      setTimeout(() => { document.getElementById('lockPopup').style.transform = 'translateX(-10px)'; }, 100);
      setTimeout(() => { document.getElementById('lockPopup').style.transform = 'translateX(0)'; }, 200);
    }
  }

  let detailTitleClicks = 0; 
  function openStory(index) {
    const story = stories[index];
    const titleEl = document.getElementById('detailTitle');
    titleEl.innerText = story.title;
    document.getElementById('detailText').innerHTML = story.content;
    detailTitleClicks = 0;

    if (index === 4) {
      titleEl.style.cursor = 'pointer';
      titleEl.onclick = function() {
        detailTitleClicks++;
        if (detailTitleClicks >= 5) {
          document.getElementById('detailPopup').classList.remove('show');
          document.getElementById('secretLockPopup').classList.add('show');
          userInput = ""; 
          targetCode = "121"; 
        }
      };
    } else {
      titleEl.style.cursor = 'default';
      titleEl.onclick = null;
    }
    document.getElementById('detailPopup').classList.add('show');
  }

  function closeDetail() { document.getElementById('detailPopup').classList.remove('show'); }

  let userInput = ""; 
  let targetCode = "121";

  function clickName(num) {
    const err = document.getElementById('secretError');
    err.style.display = 'none';

    userInput += num;
    if (userInput.length > 3) { userInput = userInput.slice(-3); }

    if (targetCode.startsWith(userInput)) {
      if (userInput === targetCode) {
        setTimeout(() => {
          alert("【机关已解开】\n隐藏的档案柜打开了...");
          closeAll();
        }, 100);
      }
    } else {
      err.style.display = 'block';
      userInput = num; 
    }
  }

  function closeAll() {
    document.getElementById('lostPopup').classList.remove('show');
    document.getElementById('lockPopup').classList.remove('show');
    document.getElementById('unlockedPopup').classList.remove('show');
    document.getElementById('detailPopup').classList.remove('show');
    document.getElementById('secretLockPopup').classList.remove('show');
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('dateInput').value = '';
    document.getElementById('nameInput').value = '';
  }
</script>
</body>
</html>
