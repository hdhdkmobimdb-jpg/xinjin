<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新京村 - 公告栏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height: 100vh; height: 100dvh;
    background-color: #0a0a0a; color: #fff;
    display: flex; justify-content: center; align-items: center;
    font-family: "SimSun", serif; overflow: hidden;
  }
  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center; color: #8a0f0f;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }

  .board {
    width: 80%; max-width: 900px; background: #151515;
    border: 2px solid #333; padding: 30px;
  }
  .header { text-align: center; font-size: 1.8rem; border-bottom: 2px solid #444; padding-bottom: 15px; margin-bottom: 20px; }
  .admin { display: flex; justify-content: space-around; color: #888; margin-bottom: 30px; }
  .tasks { display: flex; justify-content: space-around; }
  .btn {
    width: 45%; padding: 20px; background: #1a1a1a; border: 1px solid #333;
    color: #aaa; font-size: 1.4rem; text-align: center; cursor: pointer;
  }
  .btn:active { background: #2a0a0a; border-color: #6a0f0f; color: #ff2b2b; }
</style>
</head>
<body>
  <div class="rotate">请将手机横屏</div>
  <div class="board">
    <div class="header">新京村村委会公告板</div>
    <div class="admin">
      <span>管理员：赵某某</span>
      <span>村长：李某某</span>
      <span>副村长：王某某</span>
    </div>
    <div class="tasks">
      <div class="btn" onclick="alert('档案室已上锁。')">村内小事</div>
      <div class="btn" onclick="alert('资料已被撕毁。')">村内大事</div>
    </div>
  </div>
</body>
</html>
