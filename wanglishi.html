<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>王力石 - 个人档案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background-color: #0d0d0d; color: #ddd; font-family: "SimSun", serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 50px 20px; line-height: 2; font-size: 1.2rem; letter-spacing: 2px;
  }

  .document {
    max-width: 700px; width: 100%; background: #e8e5db; color: #222;
    padding: 40px; position: relative; border: 1px solid #ccc;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .doc-title { text-align: center; font-size: 2rem; font-weight: bold; color: #b32020; margin-bottom: 30px; border-bottom: 2px solid #b32020; padding-bottom: 15px;}

  .content p { margin-bottom: 20px; text-align: justify; }

  #shihuai {
    font-weight: bold; font-size: 1.3rem;
    transition: color 2s ease, text-shadow 2s ease;
  }

  .red-text {
    color: #ff0000 !important;
    text-shadow: 0 0 10px rgba(255,0,0,0.8);
  }

  .back-link {
    display: block; text-align: center; margin-top: 40px; padding: 10px;
    border: 1px solid #999; color: #333; background: #ccc;
    text-decoration: none; cursor: pointer; font-size: 1rem; transition: all 0.3s;
  }
  .back-link:active { background: #999; color: #000; }

  .stamp {
    position: absolute; bottom: 30px; right: 30px;
    width: 120px; height: 120px; border: 4px solid #d32f2f; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    color: #d32f2f; font-weight: bold; font-size: 1.2rem;
    transform: rotate(-15deg); opacity: 0.7;
  }
</style>
</head>
<body>

  <div class="document">
    <div class="doc-title">新的副村！人帅心善的王力石</div>
    
    <div class="content">
      <p>出生日期1996年7月5号，土生土长的村里人。</p>
      <p>每天都在做好人好事，所有村民都被他帮助过。于是在副村长退休时，所有村民都力顶王力石上任。</p>
      <p>可惜不幸的是，他的妻子在他上任那天失踪了。他非常伤心，花了1万为他妻子举办了葬礼。</p>
      <p>但是没过多久他就<span id="shihuai">释怀了</span>。</p>
    </div>

    <div class="stamp">新京村村委会</div>

    <div class="back-link" onclick="window.location.href='./board.html'">【 返回公告板 】</div>
  </div>

<script>
  let triggered = false;

  // 监听屏幕滚动，判定“释怀了”是否出现在屏幕可视区域内
  window.addEventListener('scroll', () => {
    const shihuaiElement = document.getElementById('shihuai');
    
    // 获取“释怀了”在屏幕上的位置
    const rect = shihuaiElement.getBoundingClientRect();
    
    // 如果它的顶部小于屏幕高度，且底部大于 0，说明它已经出现在玩家视野里了
    const isVisible = (rect.top < window.innerHeight && rect.bottom > 0);

    if (isVisible && !triggered) {
      triggered = true; // 防止重复触发
      
      // 玩家看到文字的3秒后，直接变红
      setTimeout(() => {
        shihuaiElement.classList.add('red-text');
      }, 3000);
    }
  });

  // 如果页面没滚动，文字也刚好直接显示在屏幕里，触发一次检查
  setTimeout(() => {
    const shihuaiElement = document.getElementById('shihuai');
    const rect = shihuaiElement.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0 && !triggered) {
      triggered = true;
      setTimeout(() => { shihuaiElement.classList.add('red-text'); }, 3000);
    }
  }, 500);
</script>
</body>
</html>
