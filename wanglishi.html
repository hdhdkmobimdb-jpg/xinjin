<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>王力石 - 个人档案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background-color: #0d0d0d; color: #ddd; font-family: "SimSun", serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 50px 20px; line-height: 2; font-size: 1.2rem; letter-spacing: 2px;
  }

  /* 公章样式排版 */
  .document {
    max-width: 700px; width: 100%; background: #e8e5db; color: #222;
    padding: 40px; position: relative; border: 1px solid #ccc;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  /* 顶部大字标题 */
  .doc-title { text-align: center; font-size: 2rem; font-weight: bold; color: #b32020; margin-bottom: 30px; border-bottom: 2px solid #b32020; padding-bottom: 15px;}

  .content p { margin-bottom: 20px; text-align: justify; }

  /* 释怀了 三个字，初始为普通颜色 */
  #shihuai {
    font-weight: bold;
    font-size: 1.3rem;
    transition: color 2s ease, text-shadow 2s ease;
  }

  /* 滑到底部3秒后，变红特效 */
  .red-text {
    color: #ff0000 !important;
    text-shadow: 0 0 10px rgba(255,0,0,0.8);
  }

  /* 底部返回按钮 */
  .back-link {
    display: block; text-align: center; margin-top: 40px; color: #666;
    text-decoration: underline; cursor: pointer; font-size: 1rem;
  }
  .back-link:active { color: #b32020; }

  /* 公章图案 */
  .stamp {
    position: absolute; bottom: 30px; right: 30px;
    width: 120px; height: 120px; border: 4px solid #d32f2f; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    color: #d32f2f; font-weight: bold; font-size: 1.2rem;
    transform: rotate(-15deg); opacity: 0.7;
  }
</style>
</head>
<body>

  <div class="document">
    <div class="doc-title">新的副村！人帅心善的王力石</div>
    
    <div class="content">
      <p>出生日期1996年7月5号，土生土长的村里人。</p>
      <p>每天都在做好人好事，所有村民都被他帮助过。于是在副村长退休时，所有村民都力顶王力石上任。</p>
      <p>可惜不幸的是，他的妻子在他上任那天失踪了。他非常伤心，花了1万为他妻子举办了葬礼。</p>
      <p>但是没过多久他就<span id="shihuai">释怀了</span>。</p>
    </div>

    <!-- 公章装饰 -->
    <div class="stamp">新京村村委会</div>

    <!-- 返回按钮，点击回到公告板 -->
    <div class="back-link" onclick="window.location.href='board.html'">【点击返回公告栏】</div>
  </div>

<script>
  let triggered = false;

  // 监听页面滚动
  window.addEventListener('scroll', () => {
    // 判断是否滑动到了页面最底部
    if (!triggered && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 20) {
      triggered = true; // 防止重复触发
      
      // 停留 3 秒后（3000毫秒），让文字变红
      setTimeout(() => {
        const shihuai = document.getElementById('shihuai');
        shihuai.classList.add('red-text');
      }, 3000);
    }
  });
</script>
</body>
</html>
