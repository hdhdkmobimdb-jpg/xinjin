<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邓凯的手机</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height: 100vh; height: 100dvh;
    background-color: #111; color: #fff;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-family: "SimSun", serif;
  }
  h1 { font-size: 2rem; margin-bottom: 40px; color: #ccc; letter-spacing: 2px; }
  .btn {
    display: block; width: 300px; padding: 15px; margin-bottom: 20px;
    background: transparent; border: 1px solid #555; color: #aaa;
    font-size: 1.2rem; text-align: center; cursor: pointer; transition: all 0.3s;
  }
  .btn:active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); }
  .browser-btn { border-color: #2196F3; color: #2196F3; }
  .toast {
    color: #ff2b2b; font-size: 1rem; margin-top: 20px; opacity: 0; transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
  .rotate {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 9999; justify-content: center; align-items: center; color: #8a0f0f;
  }
  @media (orientation: portrait) and (max-width: 1024px) { .rotate { display: flex; } }
</style>
</head>
<body>

  <div class="rotate">请将手机横屏</div>

  <div>
    <h1>桌面</h1>
    <div class="btn" onclick="showMsg()">微信</div>
    <div class="btn" onclick="showMsg()">通讯录</div>
    <div class="btn" onclick="showMsg()">有畏契约</div>
    <div class="btn" onclick="showMsg()">和平精英</div>
    <!-- 跳转加 ./ -->
    <div class="btn browser-btn" onclick="window.location.href='./browser.html'">打开浏览器</div>
    <div class="toast" id="msg">该软件制作中...</div>
  </div>

<script>
  function showMsg() {
    const msg = document.getElementById('msg');
    msg.classList.add('show');
    setTimeout(() => { msg.classList.remove('show'); }, 1500);
  }
</script>
</body>
</html>
